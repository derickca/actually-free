name: Deploy site to Cloudflare (Pages)

# Actually Free: the site's files are generated locally and committed,
# so this workflow is a publish-only recipe. It uploads the committed
# tree of the main branch to the Pages project "actually-free".
#
# Landing a change (a push) and publishing it are two separate acts.
# The PUBLISH_HOLD repository variable is the switch: "auto" publishes
# on the push, a whole number of minutes batches changes until the gap
# since the previous push is at least that long, and "held" never
# publishes on its own. A value that is none of those counts as held.
# A hand dispatch always publishes at once. A run stopped by the
# switch ends green and says in its summary what is waiting.
# See "Deploying" in AGENTS.md.

on:
  push:
    branches: [main]
    # Documentation files are nothing the service serves, so a
    # docs-only push runs nothing (Test, Build and Release, §4) —
    # the same exclusion the Catalogue validation workflow carries.
    # The docs ride the next real publish's archive, as they do today.
    paths-ignore:
      - '*.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Read the publish switch
        id: hold
        env:
          SWITCH: ${{ vars.PUBLISH_HOLD }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          publish=false
          reason=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            publish=true
            reason="hand dispatch always publishes"
          elif [ "$SWITCH" = "auto" ]; then
            publish=true
            reason="the switch is auto"
          elif [ "$SWITCH" = "held" ]; then
            reason="the switch is held"
          elif [[ "$SWITCH" =~ ^[0-9]+$ ]]; then
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              publish=true
              reason="no previous push to measure a quiet gap against"
            else
              prev=$(git show -s --format=%ct "$BEFORE_SHA")
              now=$(date +%s)
              gap_min=$(( (now - prev) / 60 ))
              if [ "$gap_min" -ge "$SWITCH" ]; then
                publish=true
                reason="the batch has been quiet for ${gap_min} minutes (switch: ${SWITCH})"
              else
                reason="the batch has been quiet for only ${gap_min} minutes (switch: ${SWITCH})"
              fi
            fi
          else
            reason="the switch value '${SWITCH}' is not auto, held or a whole number of minutes, so it counts as held"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Switch: '${SWITCH:-<unset>}' - $reason; publish=$publish"

      - name: Stage the committed tree
        if: steps.hold.outputs.publish == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/site"

      # Publish guards (issue #37): two of the three guards the
      # Test, Build and Release Standard names at the moment of
      # publishing, run against the staged tree before anything
      # is published. The publish-set check proves the staged
      # tree is complete against its own sitemap and catalogue —
      # every sitemap URL maps to a file, every listing has its
      # page and its sitemap URL. The removal tripwire compares
      # the staged sitemap against the live site's: a live page
      # missing from the staged set stops this publish, unless
      # the removal stands recorded as deliberate in
      # retired-pages.txt in this repo. The third guard, the
      # destructive-migration guard, does not apply here: the
      # site has no migrations and holds no stored data. A trip
      # fails this run before the publish step, so nothing is
      # published; it stops this one publish and no other — the
      # next push or dispatch runs the guards afresh.
      - name: Guard the publish set
        if: steps.hold.outputs.publish == 'true'
        run: |
          python3 tools/check-publish-set.py --staged-dir "$RUNNER_TEMP/site"
          python3 tools/check-removal-tripwire.py --staged "$RUNNER_TEMP/site/sitemap.xml" --retired retired-pages.txt

      - name: Publish to Cloudflare Pages
        if: steps.hold.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # One attempt. If this fails, the run fails and the failure
          # lines are read before anything is re-dispatched; there is
          # no silent retry.
          npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/site" --project-name actually-free --branch main --commit-hash "$GITHUB_SHA"

      - name: Smoke the published copy
        if: steps.hold.outputs.publish == 'true'
        # The deploy smoke named in docs/E2E.md: three happy paths on
        # the copy that just published. A red smoke fails this run —
        # there is no promotion to hold, so the failed run is the
        # loud alarm. The run's checks are also written as JSON for
        # the report step below.
        env:
          SMOKE_RESULTS: ${{ runner.temp }}/smoke-results.json
        run: python3 tools/smoke.py --results "$SMOKE_RESULTS"

      # Results reporting (issue #29): the deploy's Build Tests
      # report and the day's Release Review declaration go to the
      # central results store. The step runs whether the smoke
      # passed or failed, whenever this run published: it declares
      # the deploy's Build Tests expectation (due one hour after,
      # grace two hours) and sends the smoke's start and finish
      # reports, then declares the day's Release Review
      # expectation under the day's review run name (due
      # 30 minutes after the publish, grace two hours) — the row
      # the Release Review runner's report earns. The reporter
      # credential is the repository secret the centre placed for
      # this app, handed to this step for that run only. The step
      # cannot fail the run: the script is fail-soft by design and
      # this step's own exit is pinned to 0 behind it — a publish
      # never waits on the results store.
      - name: Report the deploy smoke
        if: always() && steps.hold.outputs.publish == 'true'
        env:
          MEMBERSPARK_RESULTS_TOKEN: ${{ secrets.MEMBERSPARK_RESULTS_TOKEN }}
          SMOKE_RESULTS: ${{ runner.temp }}/smoke-results.json
          DEPLOY_RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          python3 tools/report-deploy.py | tee /tmp/report-deploy.txt
          grep '^Results report:' /tmp/report-deploy.txt | tail -2 >> "$GITHUB_STEP_SUMMARY" || true
          exit 0

      # Bing URL submission (issue #40): the pages this publish
      # changed go to Bing's Webmaster API in the same run, so
      # discovery stops waiting on Bing's own schedule. The step
      # runs after the publish and its smoke — only a publish
      # that landed is submitted. tools/bing-submit.py hashes
      # the staged tree this run published and diffs the hashes
      # against the manifest its last accepted submission left
      # on this runner's disk: publishing is batched by the
      # PUBLISH_HOLD switch, so no push range can name what a
      # publish changed — the staged bytes can. The API key is
      # fetched at run time from the owner's 1Password through
      # the runner's own op-secret.sh (the 'Bing Webmaster API
      # Key' item, Service Accounts vault) and rests nowhere;
      # the step adds no Actions secret. The step cannot fail
      # the run: the script fails soft by design and reports in
      # the log and the step summary, and this step's own exit
      # is pinned to 0 behind it — a publish never waits on
      # Bing, and the manifest only advances on acceptance, so
      # an unsubmitted change is retried by the next publish.
      - name: Submit changed URLs to Bing
        if: steps.hold.outputs.publish == 'true'
        env:
          BING_STAGED_DIR: ${{ runner.temp }}/site
        run: |
          set +e
          python3 tools/bing-submit.py | tee /tmp/bing-submit.txt
          grep '^Bing submit:' /tmp/bing-submit.txt | tail -1 >> "$GITHUB_STEP_SUMMARY" || true
          exit 0

      - name: Say what happened
        if: always()
        env:
          PUBLISHED: ${{ steps.hold.outputs.publish }}
          REASON: ${{ steps.hold.outputs.reason }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          {
            if [ "$PUBLISHED" = "true" ]; then
              echo "## Published"
              echo ""
              echo "Published $GITHUB_SHA to actually-free.com ($REASON)."
            else
              echo "## Held - nothing published"
              echo ""
              echo "Publishing is held: $REASON."
              echo ""
              echo "Commits in this push now waiting:"
              if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
                git log --oneline "$BEFORE_SHA..HEAD" | sed 's/^/- /'
              else
                git log --oneline -5 | sed 's/^/- /'
              fi
              echo ""
              echo "Plus anything landed earlier that has not published. A hand dispatch of this workflow publishes everything waiting, at once."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
